version: '3.8'

services:
  # Jenkins 服务配置 (关键部分)
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_server
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    user: root
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/bin/docker-compose:/usr/bin/docker-compose
      - /usr/lib/x86_64-linux-gnu/libltdl.so.7:/usr/lib/x86_64-linux-gnu/libltdl.so.7
      - /home/ubuntu/.ssh/id_ed25519:/var/jenkins_home/.ssh/id_ed25519:ro
    networks:
      - app-network

  # 后端服务
  backend:
    build:
      context: ./ssm-admin-backend
    container_name: ssm-backend
    restart: always
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  # 前端服务
  frontend:
    build:
      context: ./soybean-admin
    container_name: vue-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge