services:
  backend:
    build:
      context: ./ssm-admin-backend
      dockerfile: Dockerfile
    image: ssm-admin-backend:latest
    container_name: ssm-backend
    restart: always
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  frontend:
    build:
      context: ./soybean-admin
    container_name: vue-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge