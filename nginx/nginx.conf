user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # HTTP 服务
    server {
        listen       80;
        server_name  localhost; # 如果有域名，把这里改成你的域名

        # 强制 HTTP 跳转到 HTTPS (如果你暂时不配置HTTPS，可以把下面这行注释掉)
        # rewrite ^(.*)$ https://$host$1 permanent;

        # 部署 Vue 前端项目
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            # Vue Router history 模式必须配置此项
            try_files $uri $uri/ /index.html;
        }

        # 代理后端接口 (前端请求 /api 转发给后端的 Tomcat)
        location /api/ {
            # 这里的 ssm-backend 是 docker-compose 里的后端容器名，Docker 会自动解析 IP
            # 注意末尾有没有斜杠的区别：如果有斜杠，会剥离 /api 路径；通常 SSM 项目不需要剥离，看你后端代码怎么写的
            proxy_pass http://ssm-backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # HTTPS 服务 (如果你有 SSL 证书，解除下面的注释即可)
    # server {
    #     listen       443 ssl;
    #     server_name  localhost; # 替换为你的域名
    #
    #     # 证书映射路径（在 docker-compose.yml 中挂载）
    #     ssl_certificate      /etc/nginx/ssl/your_cert.pem;
    #     ssl_certificate_key  /etc/nginx/ssl/your_key.key;
    #
    #     location / {
    #         root   /usr/share/nginx/html;
    #         index  index.html index.htm;
    #         try_files $uri $uri/ /index.html;
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://ssm-backend:8080/;
    #         proxy_set_header Host $host;
    #     }
    # }
}